name: Idea
description: Something Pirsig should do.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The need, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How Pirsig could help
  - type: textarea
    id: method
    attributes:
      label: Which method it serves
      description: PARA, the Zettelkasten method, a channel (GitHub, arXiv, RSS, Obsidian), the desktop app...
