[package]
name = "pirsig-desktop"
description = "Pirsig as a desktop app (Tauri 2): the whole brain, with Pirsig's REST API inside"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

# not a member of the Pirsig workspace: Tauri needs a system webview to build, and
# `just check` should not (see ../README.md)
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
zettelkasten = { path = "../.." }
loco-rs = { version = "1.2" }
tokio = { version = "1.45", features = ["rt-multi-thread", "net", "time"] }
