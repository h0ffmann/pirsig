[package]
name = "pirsig-github"
description = "psg bootstrap: the GitHub App manifest and the rules for minimal indexing of a user's FOSS work"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "pirsig-gh-app"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
